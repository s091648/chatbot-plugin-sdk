[project]
name = "chatbot-plugin-sdk"
version = "1.2.2"
description = "Python SDK for the vector storage toolbox — RAG article ingestion and querying"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "pgvector",
    "httpx",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.3"]
sync = ["psycopg2-binary>=2.9"]
gemini = ["google-genai>=1.0"]
# Tracing is fully optional — GeminiDenseProvider/RetrieveProcessor accept
# an injected `tracer` (chatbot_plugin_sdk.protocols.Tracer) and otherwise
# fall back to real OpenTelemetry only if this extra (or the host app's own
# opentelemetry-api install) is present, else a no-op. See protocols.py's
# `default_tracer()`.
otel = ["opentelemetry-api"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_plugin_sdk"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
